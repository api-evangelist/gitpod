      additionalProperties: false
      description: "UpdateWindow defines a daily time window (UTC) during which auto-updates are allowed.\n The window must be at least 2 hours long.\n Overnight windows are supported (e.g., start_hour=22, end_hour=4)."
      properties:
        endHour:
          description: "end_hour is the end of the update window as a UTC hour (0-23).\n If not set, defaults to start_hour + 2."
          nullable: true
          title: end_hour
          type: integer
        startHour:
          description: "start_hour is the beginning of the update window as a UTC hour (0-23).\n +required"
          nullable: true
          title: start_hour
          type: integer
      title: UpdateWindow
      type: object
