        denylist:
          description: denylist is the list of executable paths or names to block
          items:
            type: string
          title: denylist
          type: array
        enabled:
          description: enabled controls whether executable blocking is active
          title: enabled
          type: boolean
        resolveBareNames:
          description: "resolve_bare_names enables the discovery agent to resolve bare executable\n names in the denylist to full filesystem paths. Gated by a feature flag\n for incremental rollout."
          title: resolve_bare_names
          type: boolean
          x-stainless-skip: true
        untouchable:
          description: "untouchable enables file I/O blocking on denylisted files. When true,\n every read()/write() on a denylisted file is blocked via the\n security_file_permission LSM hook. Gated by a feature flag."
          title: untouchable
          type: boolean
          x-stainless-skip: true
        watch:
          description: "watch enables the BPF file watcher that emits events when denylisted\n files are modified, unlinked, or renamed. Used by the self-healing\n responder to keep the hash denylist up to date."
          title: watch
          type: boolean
          x-stainless-skip: true
      title: Exec
      type: object
