    gitpod.v1.AutomationTrigger:
      additionalProperties: false
      description: "An AutomationTrigger represents a trigger for an automation action.\n The `manual` field shows a start button in the UI for manually triggering the automation.\n The `post_machine_start` field indicates that the automation should be triggered after the machine has started, before the devcontainer is ready.\n This is used for machine-level services like security agents that need to start early.\n The `post_environment_start` field indicates that the automation should be triggered after the environment has started (devcontainer ready).\n The `post_devcontainer_start` field indicates that the automation should be triggered after the dev container has started.\n The `prebuild` field starts the automation during a prebuild of an environment. This phase does not have user secrets available.\n The `before_snapshot` field triggers the automation after all prebuild tasks complete but before the snapshot is taken.\n This is used for tasks that need to run last during prebuilds, such as IDE warmup.\n Note: The prebuild and before_snapshot triggers can only be used with tasks, not services."
      oneOf:
      - not:
          anyOf:
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - beforeSnapshot
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - manual
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - postDevcontainerStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - postEnvironmentStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - prebuild
        required:
        - postMachineStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
        required:
        - prebuild
      properties:
        beforeSnapshot:
          title: before_snapshot
          type: boolean
        manual:
          title: manual
          type: boolean
        postDevcontainerStart:
          title: post_devcontainer_start
          type: boolean
        postEnvironmentStart:
          title: post_environment_start
          type: boolean
        postMachineStart:
          title: post_machine_start
          type: boolean
        prebuild:
          title: prebuild
          type: boolean
      title: AutomationTrigger
      type: object
