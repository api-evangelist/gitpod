  /gitpod.v1.RunnerInteractionService/UpdateRunnerConfigurationSchema:
    servers: []
    post:
      description: "Updates the configuration schema for a runner.\n\n Use this method to:\n - Define configuration options\n - Update schema definitions\n - Set validation rules\n\n ### Examples\n\n - Update schema:\n\n   Updates runner configuration schema.\n\n   ```yaml\n   runnerId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   configSchema:\n     version: \"1.0\"\n     runnerConfig:\n       - id: \"region\"\n         name: \"Region\"\n         description: \"Deployment region\"\n         required: true\n         string:\n           default: \"us-west\"\n           pattern: \"^[a-z]+-[a-z]+-[0-9]+$\"\n       - id: \"autoUpdate\"\n         name: \"Auto Update\"\n         description: \"Enable automatic updates\"\n         required: true\n         bool:\n           default: true\n   ```"
      operationId: gitpod.v1.RunnerInteractionService.UpdateRunnerConfigurationSchema
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              update_schema:
                description: Updates runner configuration schema.
                value:
                  configSchema:
                    runnerConfig:
                    - description: Deployment region
                      id: region
                      name: Region
                      required: true
                      string:
                        default: us-west
                        pattern: ^[a-z]+-[a-z]+-[0-9]+$
                    - bool:
                        default: true
                      description: Enable automatic updates
                      id: autoUpdate
                      name: Auto Update
                      required: true
                    version: '1.0'
                  runnerId: d2c94c27-3b76-4a42-b88c-95a85e392c68
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateRunnerConfigurationSchemaRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateRunnerConfigurationSchemaResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateRunnerConfigurationSchema
      tags:
      - gitpod.v1.RunnerInteractionService
