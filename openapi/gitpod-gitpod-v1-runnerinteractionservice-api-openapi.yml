  /gitpod.v1.RunnerInteractionService/UpdateRunnerEnvironmentStatus:
    servers: []
    post:
      description: "Provides comprehensive status updates about a managed environment. This method allows\n runners to report detailed state information about environments they're managing.\n\n Use this method to:\n - Report current environment phase and health status\n - Update machine and container states\n - Signal content and devcontainer readiness\n - Provide access URLs and endpoints\n - Report warnings or failure conditions\n\n ### Examples\n\n - Update status:\n\n   Provides a detailed status update for an environment.\n\n   ```yaml\n   runnerId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   environmentId: \"07e03a28-65a5-4d98-b532-8ea67b188048\"\n   status:\n     phase: ENVIRONMENT_PHASE_RUNNING\n     statusVersion: \"1\"\n     failureMessage: []\n     warningMessage: []\n     machine:\n       phase: PHASE_RUNNING\n     content:\n       phase: CONTENT_PHASE_READY\n     devcontainer:\n       phase: PHASE_RUNNING\n     environmentUrls:\n       logs: \"https://logs.gitpod.io/environment\"\n       ports: []\n       ssh:\n         url: \"ssh://ssh.gitpod.io:22\"\n   ```"
      operationId: gitpod.v1.RunnerInteractionService.UpdateRunnerEnvironmentStatus
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              update_status:
                description: Provides a detailed status update for an environment.
                value:
                  environmentId: 07e03a28-65a5-4d98-b532-8ea67b188048
                  runnerId: d2c94c27-3b76-4a42-b88c-95a85e392c68
                  status:
                    content:
                      phase: CONTENT_PHASE_READY
                    devcontainer:
                      phase: PHASE_RUNNING
                    environmentUrls:
                      logs: https://logs.gitpod.io/environment
                      ports: []
                      ssh:
                        url: ssh://ssh.gitpod.io:22
                    failureMessage: []
                    machine:
                      phase: PHASE_RUNNING
                    phase: ENVIRONMENT_PHASE_RUNNING
                    statusVersion: '1'
                    warningMessage: []
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateRunnerEnvironmentStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateRunnerEnvironmentStatusResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateRunnerEnvironmentStatus
      tags:
      - gitpod.v1.RunnerInteractionService
  /gitpod.v1.RunnerInteractionService/UpdateRunnerStatus:
    servers: []
    post:
      description: "Updates the runner's status and capabilities.\n\n Use this method to:\n - Report runner health\n - Update version information\n - Signal system changes\n - Configure capabilities\n\n ### Examples\n\n - Update status:\n\n   Updates runner status and details.\n\n   ```yaml\n   runnerId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   version: \"1.2.3\"\n   systemDetails: \"Linux x86_64\"\n   logUrl: \"https://logs.example.com/runner\"\n   region: \"us-west\"\n   capabilities: [\"RUNNER_CAPABILITY_SECRET_CONTAINER_REGISTRY\"]\n   ```"
      operationId: gitpod.v1.RunnerInteractionService.UpdateRunnerStatus
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              update_status:
                description: Updates runner status and details.
                value:
                  capabilities:
                  - RUNNER_CAPABILITY_SECRET_CONTAINER_REGISTRY
                  logUrl: https://logs.example.com/runner
                  region: us-west
                  runnerId: d2c94c27-3b76-4a42-b88c-95a85e392c68
                  systemDetails: Linux x86_64
