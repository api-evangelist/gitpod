components:
  schemas:
    gitpod.v1.EnvironmentStatus.DevContainer.Phase:
      enum:
      - PHASE_UNSPECIFIED
      - PHASE_CREATING
      - PHASE_RUNNING
      - PHASE_STOPPED
      - PHASE_FAILED
      title: Phase
      type: string
    gitpod.v1.GetRunnerWarmPoolRequest:
      additionalProperties: false
      properties:
        runnerId:
          description: The runner's identity
          format: uuid
          title: runner_id
          type: string
        warmPoolId:
          description: warm_pool_id specifies the warm pool to retrieve
          format: uuid
          title: warm_pool_id
          type: string
      required:
      - runnerId
      - warmPoolId
      title: GetRunnerWarmPoolRequest
      type: object
    gitpod.v1.CallPing.Request:
      additionalProperties: false
      properties:
        empty:
          type: boolean
      title: Request
      type: object
    gitpod.v1.WakeEvent.EnvironmentPhaseReached:
      additionalProperties: false
      properties:
        environmentId:
          title: environment_id
          type: string
        failureMessage:
          items:
            type: string
          title: failure_message
          type: array
        phase:
          description: The phase the environment reached (e.g. "running", "stopped", "deleted").
          title: phase
          type: string
      title: EnvironmentPhaseReached
      type: object
    gitpod.v1.MarkRunnerActiveRequest:
      additionalProperties: false
      properties:
        runnerId:
          description: The runner's identity
          format: uuid
          title: runner_id
          type: string
      title: MarkRunnerActiveRequest
      type: object
    gitpod.v1.CallSendMessageToAgentExecution.Response:
      additionalProperties: false
      title: Response
      type: object
    gitpod.v1.RunnerConfigurationSchema.EnumField.Value:
      additionalProperties: false
      properties:
        detail:
          title: detail
          type: string
        subtitle:
          title: subtitle
          type: string
        title:
          title: title
          type: string
      title: Value
      type: object
    gitpod.v1.ListRunnerLLMIntegrationsRequest:
      additionalProperties: false
      properties:
        filter:
          $ref: '#/components/schemas/gitpod.v1.ListRunnerLLMIntegrationsRequest.Filter'
          title: filter
        pagination:
          $ref: '#/components/schemas/gitpod.v1.PaginationRequest'
          description: pagination contains the pagination options for listing LLM integrations
          title: pagination
        runnerId:
          description: The runner's identity
          format: uuid
          title: runner_id
          type: string
      title: ListRunnerLLMIntegrationsRequest
      type: object
    gitpod.v1.EnvironmentSpec.Secret:
      additionalProperties: false
      oneOf:
      - not:
          anyOf:
          - required:
            - containerRegistryBasicAuthHost
          - required:
            - environmentVariable
          - required:
            - filePath
          - required:
            - gitCredentialHost
        required:
        - apiOnly
      - not:
          anyOf:
          - required:
            - apiOnly
          - required:
            - environmentVariable
          - required:
            - filePath
          - required:
            - gitCredentialHost
        required:
        - containerRegistryBasicAuthHost
      - not:
          anyOf:
          - required:
            - apiOnly
          - required:
            - containerRegistryBasicAuthHost
          - required:
            - filePath
          - required:
            - gitCredentialHost
        required:
        - environmentVariable
      - not:
          anyOf:
          - required:
            - apiOnly
          - required:
            - containerRegistryBasicAuthHost
          - required:
            - environmentVariable
          - required:
            - gitCredentialHost
        required:
        - filePath
      - not:
          anyOf:
          - required:
            - apiOnly
          - required:
            - containerRegistryBasicAuthHost
          - required:
            - environmentVariable
          - required:
            - filePath
        required:
        - gitCredentialHost
      properties:
        apiOnly:
          description: "api_only indicates the secret is only available via API/CLI.\n These secrets are resolved but NOT automatically injected into services or devcontainers."
          title: api_only
          type: boolean
        containerRegistryBasicAuthHost:
          description: container_registry_basic_auth_host is the hostname of the container registry that supports basic auth
          title: container_registry_basic_auth_host
          type: string
