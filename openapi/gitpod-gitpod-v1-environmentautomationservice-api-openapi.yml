          enum:
          - canceled
          - unknown
          - invalid_argument
          - deadline_exceeded
          - not_found
          - already_exists
          - permission_denied
          - resource_exhausted
          - failed_precondition
          - aborted
          - out_of_range
          - unimplemented
          - internal
          - unavailable
          - data_loss
          - unauthenticated
          example:
          - not_found
          type: string
        message:
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
          type: string
      title: Connect Error
      type: object
    gitpod.v1.UpdateTaskRequest.TaskMetadata:
      additionalProperties: false
      properties:
        description:
          nullable: true
          title: description
          type: string
        name:
          minLength: 1
          nullable: true
          title: name
          type: string
        triggeredBy:
          $ref: '#/components/schemas/gitpod.v1.UpdateTaskRequest.AutomationTriggerUpdate'
          nullable: true
          title: triggered_by
      title: TaskMetadata
      type: object
    gitpod.v1.ListTaskExecutionsRequest:
      additionalProperties: false
      properties:
        filter:
          $ref: '#/components/schemas/gitpod.v1.ListTaskExecutionsRequest.Filter'
          description: filter contains the filter options for listing task runs
          title: filter
        pagination:
          $ref: '#/components/schemas/gitpod.v1.PaginationRequest'
          description: pagination contains the pagination options for listing task runs
          title: pagination
      title: ListTaskExecutionsRequest
      type: object
    gitpod.v1.StopServiceRequest:
      additionalProperties: false
      properties:
        id:
          format: uuid
          title: id
          type: string
      title: StopServiceRequest
      type: object
    gitpod.v1.UpdateServiceResponse:
      additionalProperties: false
      title: UpdateServiceResponse
      type: object
    gitpod.v1.AutomationsFile.Service:
      additionalProperties: false
      properties:
        commands:
          $ref: '#/components/schemas/gitpod.v1.ServiceSpec.Commands'
          title: commands
        description:
          title: description
          type: string
        name:
          minLength: 1
          title: name
          type: string
        role:
          enum:
          - ''
          - default
          - editor
          - ai-agent
          title: role
          type: string
        runsOn:
          $ref: '#/components/schemas/gitpod.v1.RunsOn'
          title: runs_on
        triggeredBy:
          items:
            enum:
            - manual
            - postEnvironmentStart
            - postDevcontainerStart
            type: string
          title: triggered_by
          type: array
      title: Service
      type: object
    gitpod.v1.ServiceRole:
      enum:
      - SERVICE_ROLE_UNSPECIFIED
      - SERVICE_ROLE_DEFAULT
      - SERVICE_ROLE_EDITOR
      - SERVICE_ROLE_AI_AGENT
      - SERVICE_ROLE_SECURITY_AGENT
      title: ServiceRole
      type: string
    gitpod.v1.TaskExecutionMetadata:
      additionalProperties: false
      properties:
        completedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: completed_at is the time the task execution was done.
          title: completed_at
        createdAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: created_at is the time the task was created.
          title: created_at
        creator:
          $ref: '#/components/schemas/gitpod.v1.Subject'
          description: creator describes the principal who created/started the task run.
          title: creator
        environmentId:
          description: environment_id is the ID of the environment in which the task run is executed.
          format: uuid
          title: environment_id
          type: string
        startedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: started_at is the time the task execution actually started to run.
          title: started_at
        startedBy:
          description: started_by describes the trigger that started the task execution.
          title: started_by
          type: string
        taskId:
          description: task_id is the ID of the main task being executed.
          format: uuid
          title: task_id
          type: string
      title: TaskExecutionMetadata
      type: object
    gitpod.v1.EnvironmentVariableSource:
      additionalProperties: false
      description: EnvironmentVariableSource specifies a source for an environment variable value.
      oneOf:
      - required:
        - secretRef
      properties:
        secretRef:
          $ref: '#/components/schemas/gitpod.v1.SecretRef'
          description: secret_ref references a secret by ID.
          title: secret_ref
      title: EnvironmentVariableSource
      type: object
    gitpod.v1.CreateTaskResponse:
      additionalProperties: false
      properties:
        task:
          $ref: '#/components/schemas/gitpod.v1.Task'
          title: task
      required:
      - task
      title: CreateTaskResponse
      type: object
    gitpod.v1.TaskExecutionSpec.Group:
      additionalProperties: false
      properties:
        steps:
          items:
            $ref: '#/components/schemas/gitpod.v1.TaskExecutionSpec.Step'
          title: steps
          type: array
      title: Group
      type: object
    gitpod.v1.TaskMetadata:
      additionalProperties: false
      properties:
        createdAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: created_at is the time the task was created.
          title: created_at
        creator:
          $ref: '#/components/schemas/gitpod.v1.Subject'
          description: creator describes the principal who created the task.
          title: creator
        description:
          description: description is a user-facing description for the task. It can be used to provide context and documentation for the task.
          title: description
          type: string
        name:
          description: "name is a user-facing name for the task. Unlike the reference, this field is not unique, and not referenced by the system.\n This is a short descriptive name for the task."
          minLength: 1
          title: name
          type: string
        reference:
          description: "reference is a user-facing identifier for the task which must be unique on the environment.\n It is used to express dependencies between tasks, and to identify the task in user interactions (e.g. the CLI)."
          pattern: ^[a-zA-Z0-9_-]{1,128}$
          title: reference
          type: string
        triggeredBy:
          description: triggered_by is a list of trigger that start the task.
          items:
            $ref: '#/components/schemas/gitpod.v1.AutomationTrigger'
          title: triggered_by
          type: array
      title: TaskMetadata
      type: object
    gitpod.v1.UpsertAutomationsFileResponse:
      additionalProperties: false
      properties:
        updatedServiceIds:
          items:
            type: string
          title: updated_service_ids
          type: array
        updatedTaskIds:
          items:
            type: string
