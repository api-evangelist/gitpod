          anyOf:
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - beforeSnapshot
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - manual
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - postDevcontainerStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postMachineStart
          - required:
            - prebuild
        required:
        - postEnvironmentStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - prebuild
        required:
        - postMachineStart
      - not:
          anyOf:
          - required:
            - beforeSnapshot
          - required:
            - manual
          - required:
            - postDevcontainerStart
          - required:
            - postEnvironmentStart
          - required:
            - postMachineStart
        required:
        - prebuild
      properties:
        beforeSnapshot:
          title: before_snapshot
          type: boolean
        manual:
