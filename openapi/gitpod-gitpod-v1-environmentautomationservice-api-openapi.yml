          title: runs_on
      title: TaskSpec
      type: object
    gitpod.v1.CreateServiceResponse:
      additionalProperties: false
      properties:
        service:
          $ref: '#/components/schemas/gitpod.v1.Service'
          title: service
      required:
      - service
      title: CreateServiceResponse
      type: object
    gitpod.v1.Service:
