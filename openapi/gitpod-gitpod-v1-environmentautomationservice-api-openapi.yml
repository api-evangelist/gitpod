      title: Service
      type: object
    gitpod.v1.UpdateServiceRequest.AutomationTriggerUpdate:
      additionalProperties: false
      properties:
        trigger:
          items:
            $ref: '#/components/schemas/gitpod.v1.AutomationTrigger'
          title: trigger
          type: array
      title: AutomationTriggerUpdate
      type: object
    gitpod.v1.ListTasksResponse:
      additionalProperties: false
      properties:
        pagination:
          $ref: '#/components/schemas/gitpod.v1.PaginationResponse'
          title: pagination
        tasks:
          items:
            $ref: '#/components/schemas/gitpod.v1.Task'
          title: tasks
          type: array
      title: ListTasksResponse
      type: object
    connect.error:
      additionalProperties: true
