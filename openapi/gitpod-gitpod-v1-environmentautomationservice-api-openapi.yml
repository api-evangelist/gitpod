        id:
          format: uuid
          title: id
          type: string
        metadata:
          $ref: '#/components/schemas/gitpod.v1.ServiceMetadata'
          title: metadata
        spec:
          $ref: '#/components/schemas/gitpod.v1.ServiceSpec'
          title: spec
        status:
          $ref: '#/components/schemas/gitpod.v1.ServiceStatus'
