      properties:
        webhookId:
          format: uuid
          title: webhook_id
          type: string
      title: GetWebhookRequest
      type: object
    gitpod.v1.WorkflowAction.Limits:
      additionalProperties: false
      description: 'Limits defines execution limits for workflow actions.

        Concurrent actions limit cannot exceed total actions limit:

        ```

        this.max_parallel <= this.max_total

        ```


        '
      properties:
        maxParallel:
          description: 'Maximum parallel actions must be between 1 and 25:

            ```

            this >= 1 && this <= 25

            ```


            '
          format: int32
          title: max_parallel
          type: integer
        maxTotal:
          description: 'Maximum total actions must be between 1 and 100:

            ```

            this >= 1 && this <= 100

            ```


            '
          format: int32
          title: max_total
          type: integer
        perExecution:
          $ref: '#/components/schemas/gitpod.v1.WorkflowAction.Limits.PerExecution'
          title: per_execution
      title: Limits
      type: object
    gitpod.v1.WorkflowTrigger.PullRequestEvent:
      description: WorkflowPREvent defines pull request events that can trigger workflows.
      enum:
      - PULL_REQUEST_EVENT_UNSPECIFIED
      - PULL_REQUEST_EVENT_OPENED
      - PULL_REQUEST_EVENT_UPDATED
      - PULL_REQUEST_EVENT_APPROVED
      - PULL_REQUEST_EVENT_MERGED
      - PULL_REQUEST_EVENT_CLOSED
      - PULL_REQUEST_EVENT_READY_FOR_REVIEW
      title: PullRequestEvent
      type: string
