          title: report
        triggers:
          items:
            $ref: '#/components/schemas/gitpod.v1.WorkflowTrigger'
          title: triggers
          type: array
      title: Spec
      type: object
    gitpod.v1.WorkflowTriggerContext.Agent:
      additionalProperties: false
      description: "Execute workflow in agent-managed environments.\n Agent receives the specified prompt and manages execution context."
      properties:
        prompt:
          description: 'Agent prompt must be between 1 and 20,000 characters:

            ```

            size(this) >= 1 && size(this) <= 20000

            ```


            '
          title: prompt
          type: string
      title: Agent
      type: object
    gitpod.v1.ListWebhooksRequest.Filter:
      additionalProperties: false
      properties:
        providers:
          description: providers filters by webhook provider
          items:
            $ref: '#/components/schemas/gitpod.v1.WebhookProvider'
          maxItems: 5
          title: providers
          type: array
        types:
          description: types filters by webhook type
          items:
            $ref: '#/components/schemas/gitpod.v1.WebhookType'
          maxItems: 5
          title: types
          type: array
        webhookIds:
          description: webhook_ids filters by specific webhook IDs
          items:
            format: uuid
            maxItems: 25
            type: string
          maxItems: 25
          title: webhook_ids
          type: array
      title: Filter
      type: object
    gitpod.v1.DeleteWebhookResponse:
      additionalProperties: false
      properties:
        affectedWorkflowIds:
          description: "IDs of workflows that had their triggers converted to manual type\n because they referenced the deleted webhook."
          items:
            type: string
          title: affected_workflow_ids
          type: array
      title: DeleteWebhookResponse
      type: object
    gitpod.v1.GetWebhookRequest:
      additionalProperties: false
