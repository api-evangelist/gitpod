openapi: 3.2.0
info:
  title: Gitpod.v1.Identity Service API
  version: v1.0.0
servers:
- url: https://api.gitpod.io
  description: Gitpod API
tags:
- name: gitpod.v1.IdentityService
  x-displayName: gitpod.v1.IdentityService
paths:
  /gitpod.v1.IdentityService/ExchangeToken:
    servers: []
    post:
      description: 'Exchanges an exchange token for a new access token.


        Use this method to:

        - Convert exchange tokens to access tokens

        - Obtain new access credentials

        - Complete token exchange flows


        ### Examples


        - Exchange token:


        Trades an exchange token for an access token.


        ```yaml

        exchangeToken: "exchange-token-value"

        ```'
      operationId: gitpod.v1.IdentityService.ExchangeToken
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              exchange_token:
                description: Trades an exchange token for an access token.
                value:
                  exchangeToken: exchange-token-value
            schema:
              $ref: '#/components/schemas/gitpod.v1.ExchangeTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.ExchangeTokenResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: ExchangeToken
      tags:
      - gitpod.v1.IdentityService
  /gitpod.v1.IdentityService/GetAuthenticatedIdentity:
    servers: []
    post:
      description: 'Retrieves information about the currently authenticated identity.


        Use this method to:

        - Get current user information

        - Check authentication status

        - Retrieve organization context

        - Validate authentication principal


        ### Examples


        - Get current identity:


        Retrieves details about the authenticated user.


        ```yaml

        {}

        ```'
      operationId: gitpod.v1.IdentityService.GetAuthenticatedIdentity
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              get_current_identity:
                description: Retrieves details about the authenticated user.
                value: {}
            schema:
              $ref: '#/components/schemas/gitpod.v1.GetAuthenticatedIdentityRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.GetAuthenticatedIdentityResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: GetAuthenticatedIdentity
      tags:
      - gitpod.v1.IdentityService
  /gitpod.v1.IdentityService/GetIDToken:
    servers: []
    post:
      description: 'Gets an ID token for authenticating with other services.


        Use this method to:

        - Obtain authentication tokens for service-to-service calls

        - Access protected resources

        - Generate scoped access tokens


        ### Examples


        - Get token for single service:


        Retrieves a token for authenticating with one service.


        ```yaml

        audience:

        - "https://api.gitpod.io"

        ```


        - Get token for multiple services:


        Retrieves a token valid for multiple services.


        ```yaml

        audience:

        - "https://api.gitpod.io"

        - "https://ws.gitpod.io"

        ```'
      operationId: gitpod.v1.IdentityService.GetIDToken
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              get_token_for_multiple_services:
                description: Retrieves a token valid for multiple services.
                value:
                  audience:
                  - https://api.gitpod.io
                  - https://ws.gitpod.io
              get_token_for_single_service:
                description: Retrieves a token for authenticating with one service.
                value:
                  audience:
                  - https://api.gitpod.io
            schema:
              $ref: '#/components/schemas/gitpod.v1.GetIDTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.GetIDTokenResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: GetIDToken
      tags:
      - gitpod.v1.IdentityService
components:
  schemas:
    gitpod.v1.Subject:
      additionalProperties: false
      properties:
        id:
          description: id is the UUID of the subject
          format: uuid
          title: id
          type: string
        principal:
          $ref: '#/components/schemas/gitpod.v1.Principal'
          description: Principal is the principal of the subject
          title: principal
      title: Subject
      type: object
    gitpod.v1.GetIDTokenRequest:
      additionalProperties: false
      properties:
        audience:
          items:
            minItems: 1
            type: string
          minItems: 1
          title: audience
          type: array
        version:
          $ref: '#/components/schemas/gitpod.v1.IDTokenVersion'
          description: version is the version of the ID token.
          title: version
      title: GetIDTokenRequest
      type: object
    gitpod.v1.GetAuthenticatedIdentityRequest:
      additionalProperties: false
      properties:
        empty:
          type: boolean
      title: GetAuthenticatedIdentityRequest
      type: object
    gitpod.v1.Principal:
      enum:
      - PRINCIPAL_UNSPECIFIED
      - PRINCIPAL_ACCOUNT
      - PRINCIPAL_USER
      - PRINCIPAL_RUNNER
      - PRINCIPAL_ENVIRONMENT
      - PRINCIPAL_SERVICE_ACCOUNT
      - PRINCIPAL_RUNNER_MANAGER
      title: Principal
      type: string
    connect.error:
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
      properties:
        code:
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          enum:
          - canceled
          - unknown
          - invalid_argument
          - deadline_exceeded
          - not_found
          - already_exists
          - permission_denied
          - resource_exhausted
          - failed_precondition
          - aborted
          - out_of_range
          - unimplemented
          - internal
          - unavailable
          - data_loss
          - unauthenticated
          example:
          - not_found
          type: string
        message:
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
          type: string
      title: Connect Error
      type: object
    gitpod.v1.ExchangeTokenRequest:
      additionalProperties: false
      properties:
        exchangeToken:
          description: exchange_token is the token to exchange
          title: exchange_token
          type: string
      title: ExchangeTokenRequest
      type: object
    gitpod.v1.IDTokenVersion:
      enum:
      - ID_TOKEN_VERSION_UNSPECIFIED
      - ID_TOKEN_VERSION_V1
      - ID_TOKEN_VERSION_V2
      title: IDTokenVersion
      type: string
    gitpod.v1.GetAuthenticatedIdentityResponse:
      additionalProperties: false
      properties:
        organizationId:
          title: organization_id
          type: string
        organizationTier:
          title: organization_tier
          type: string
        subject:
          $ref: '#/components/schemas/gitpod.v1.Subject'
          description: subject is the identity of the current user
          title: subject
      title: GetAuthenticatedIdentityResponse
      type: object
    gitpod.v1.ExchangeTokenResponse:
      additionalProperties: false
      properties:
        accessToken:
          description: access_token is the new access token
          title: access_token
          type: string
      title: ExchangeTokenResponse
      type: object
    gitpod.v1.GetIDTokenResponse:
      additionalProperties: false
      properties:
        token:
          title: token
          type: string
      title: GetIDTokenResponse
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
