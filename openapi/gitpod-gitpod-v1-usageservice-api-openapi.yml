  /gitpod.v1.UsageService/GetCoAuthorTimeSeries:
    servers: []
    post:
      description: Gets co-author contribution data as a time series.
      operationId: gitpod.v1.UsageService.GetCoAuthorTimeSeries
      parameters: []
      requestBody:
