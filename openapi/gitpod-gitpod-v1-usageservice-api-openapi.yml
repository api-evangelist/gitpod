    gitpod.v1.GetCoAuthorSummaryRequest:
      additionalProperties: false
      properties:
        dateRange:
          $ref: '#/components/schemas/gitpod.v1.DateRange'
          description: Date range to query within.
          title: date_range
        projectId:
          description: Optional project ID to scope results.
          title: project_id
          type: string
        teamId:
          description: "Optional team ID to scope results to a specific team.\n Mutually exclusive with user_id."
          title: team_id
          type: string
        userId:
          description: "Optional user ID to scope results to a specific user.\n Mutually exclusive with team_id."
          title: user_id
          type: string
      required:
      - dateRange
      title: GetCoAuthorSummaryRequest
      type: object
    gitpod.v1.CoAuthorTool:
      description: "CoAuthorTool identifies the AI tool that co-authored a commit.\n UNSPECIFIED (0) is the proto default and must not appear in reported data.\n Use HUMAN for commits with no AI co-author."
      enum:
      - CO_AUTHOR_TOOL_UNSPECIFIED
      - CO_AUTHOR_TOOL_NO_COAUTHOR
      - CO_AUTHOR_TOOL_HUMAN_COAUTHOR
      - CO_AUTHOR_TOOL_ONA
      - CO_AUTHOR_TOOL_GITHUB_COPILOT
      - CO_AUTHOR_TOOL_CURSOR
      - CO_AUTHOR_TOOL_OTHER
      - CO_AUTHOR_TOOL_CLAUDE
      title: CoAuthorTool
      type: string
    gitpod.v1.GetActiveUsersCountResponse:
      additionalProperties: false
      properties:
        count:
          description: Count of active users in the date range.
          title: count
          type: string
        trend:
          description: "Fractional change in active users vs previous period.\n Computed as (current - previous) / previous."
          format: double
          title: trend
          type: number
      title: GetActiveUsersCountResponse
      type: object
    gitpod.v1.GetAgentTraceTimeSeriesRequest:
      additionalProperties: false
      properties:
        dateRange:
          $ref: '#/components/schemas/gitpod.v1.DateRange'
          description: Date range to query within.
          title: date_range
        projectId:
          description: Optional project ID to scope results.
          title: project_id
          type: string
        resolution:
          $ref: '#/components/schemas/gitpod.v1.Resolution'
          description: Time resolution for the series data.
          title: resolution
        teamId:
          description: "Optional team ID to scope results to a specific team.\n Mutually exclusive with user_id."
          title: team_id
          type: string
        userId:
          description: "Optional user ID to scope results to a specific user.\n Mutually exclusive with team_id."
          title: user_id
          type: string
      required:
      - dateRange
      title: GetAgentTraceTimeSeriesRequest
      type: object
    gitpod.v1.PrSummary:
      additionalProperties: false
      description: PrSummary contains aggregate PR speed metrics for a date range.
      properties:
        deploymentFrequency:
          description: PRs merged to the default branch per week.
          format: double
          title: deployment_frequency
          type: number
        deploymentFrequencyTrend:
          description: "Fractional change in deployment_frequency vs previous period.\n Computed as (current - previous) / previous."
          format: double
          title: deployment_frequency_trend
          type: number
        leadTimeSeconds:
          description: Median lead time for changes in seconds (first commit → merge).
          format: double
          title: lead_time_seconds
          type: number
        leadTimeTrend:
          description: "Fractional change in lead_time_seconds vs previous period.\n Computed as (current - previous) / previous."
          format: double
          title: lead_time_trend
          type: number
        prsMergedCount:
          description: Total PRs merged in the date range.
          title: prs_merged_count
          type: string
        prsMergedTrend:
          description: "Fractional change in prs_merged_count vs previous period.\n Computed as (current - previous) / previous."
          format: double
          title: prs_merged_trend
          type: number
        timeToFirstApprovalSeconds:
          description: "Median time to first approval in seconds.\n Zero when no PRs in the range had approvals."
          format: double
          title: time_to_first_approval_seconds
          type: number
        timeToFirstApprovalTrend:
          description: "Fractional change in time_to_first_approval_seconds vs previous period.\n Computed as (current - previous) / previous."
          format: double
          title: time_to_first_approval_trend
          type: number
      title: PrSummary
      type: object
