    gitpod.v1.RunnerKind:
      description: RunnerKind represents the kind of a runner
      enum:
      - RUNNER_KIND_UNSPECIFIED
      - RUNNER_KIND_LOCAL
      - RUNNER_KIND_REMOTE
      - RUNNER_KIND_LOCAL_CONFIGURATION
      title: RunnerKind
      type: string
    gitpod.v1.AgentTraceModelBreakdown:
      additionalProperties: false
      description: AgentTraceModelBreakdown contains stats for a single LLM model.
      properties:
        linesAdded:
          description: Lines added by sessions using this model.
          title: lines_added
          type: string
        linesRemoved:
          description: Lines removed by sessions using this model.
          title: lines_removed
          type: string
        model:
          $ref: '#/components/schemas/gitpod.v1.SupportedModel'
          description: The model these stats are for.
          title: model
        sessions:
          description: Number of sessions that used this model.
          title: sessions
          type: string
