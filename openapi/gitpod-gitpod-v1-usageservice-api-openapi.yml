    gitpod.v1.ToolBreakdown:
      additionalProperties: false
      description: ToolBreakdown contains stats for a single AI tool (or human).
      properties:
        commits:
          description: Number of commits attributed to this tool.
          title: commits
          type: string
        distinctAuthors:
          description: Distinct authors who used this tool.
          title: distinct_authors
          type: string
        linesAdded:
          description: Lines added by this tool.
          title: lines_added
          type: string
        linesRemoved:
          description: Lines removed by this tool.
          title: lines_removed
          type: string
        tool:
          $ref: '#/components/schemas/gitpod.v1.CoAuthorTool'
          description: The tool these stats are for.
          title: tool
      title: ToolBreakdown
      type: object
    gitpod.v1.EnvironmentUsageRecord:
      additionalProperties: false
      description: EnvironmentUsageRecord represents a record of an environment from start to stop.
      properties:
        createdAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: Time when the environment was created.
          title: created_at
        environmentClassId:
          description: Environment class ID associated with the record.
          title: environment_class_id
          type: string
        environmentId:
          description: Environment ID associated with the record.
          title: environment_id
          type: string
        id:
          description: Environment usage record ID.
          title: id
          type: string
        projectId:
          description: Project ID associated with the environment (if available).
          title: project_id
          type: string
        runnerId:
          description: Runner ID associated with the environment.
          title: runner_id
          type: string
        stoppedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: Time when the environment was stopped.
          title: stopped_at
        userId:
          description: User ID is the ID of the user who created the environment associated with the record.
          title: user_id
          type: string
