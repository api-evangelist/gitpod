          description: supported_model is the LLM model being used by the agent execution.
          title: supported_model
        terminalId:
          description: 'terminal_id is the ID of the terminal running the agent, if the agent runs as a terminal service (runsOn: terminal).'
          title: terminal_id
          type: string
          x-stainless-skip: true
        transcriptUrl:
          description: transcript_url is the URL to the LLM transcript (all messages exchanged between the agent and the LLM) of the agent run.
          title: transcript_url
          type: string
        usedEnvironments:
          description: used_environments is the list of environments that were used by the agent execution.
          items:
