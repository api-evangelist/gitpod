components:
  schemas:
    gitpod.v1.GetStripePublishableKeyRequest:
      additionalProperties: false
      properties:
        organizationId:
          description: organization_id is the ID of the organization to get the publishable key for
          format: uuid
          title: organization_id
          type: string
      required:
      - organizationId
      title: GetStripePublishableKeyRequest
      type: object
    gitpod.v1.SetBillingRealmResponse:
      additionalProperties: false
      title: SetBillingRealmResponse
      type: object
    gitpod.v1.BillingRealm:
      enum:
      - BILLING_REALM_UNSPECIFIED
      - BILLING_REALM_SANDBOX
      - BILLING_REALM_PRODUCTION
      title: BillingRealm
      type: string
    gitpod.v1.CompleteBillingSetupRequest:
      additionalProperties: false
      properties:
        organizationId:
          description: organization_id is the ID of the organization to complete billing setup for
          format: uuid
          title: organization_id
          type: string
        setupIntentId:
          description: setup_intent_id is the Stripe SetupIntent ID to verify completion
          minLength: 1
          title: setup_intent_id
          type: string
      required:
      - organizationId
      - setupIntentId
      title: CompleteBillingSetupRequest
      type: object
    gitpod.v1.CouponConfig:
      additionalProperties: false
      properties:
        autoTerminate:
          description: auto_terminate is whether the subscription should be terminated after the duration has passed
          title: auto_terminate
          type: boolean
        durationMonths:
          description: duration_months is the duration of the coupon in months
          nullable: true
          title: duration_months
          type: string
        oneTimeOcuGrant:
          description: one_time_ocu_grant is the amount of OCU this coupon grants
          nullable: true
          title: one_time_ocu_grant
