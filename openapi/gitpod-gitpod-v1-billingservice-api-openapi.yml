                    city: San Francisco
                    country: US
                    line1: 123 Main St
                    line2: Suite 100
                    postalCode: '94105'
                    state: CA
                  name: John Doe
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.SetBillingAddressRequest'
        required: true
