  /gitpod.v1.BillingService/SetupEnterpriseBilling:
    servers: []
    post:
      description: "Sets up enterprise billing for an organization.\n\n Creates a Stripe customer, subscribes to the enterprise pricing plan,\n and updates the billing realm. Idempotent — safe to retry on failure.\n\n Requires the 'change_billing_realm' account permission.\n\n ### Examples\n\n - Setup enterprise billing (production):\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   email: \"billing@example.com\"\n   ```\n\n - Setup enterprise billing (sandbox):\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   sandbox: true\n   ```"
      operationId: gitpod.v1.BillingService.SetupEnterpriseBilling
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              setup_enterprise_billing_(production):
                description: 'organizationId: "b0e12f6c-4c67-429d-a4a6-d9838b5da047"

                  email: "billing@example.com"

                  '
                value:
                  email: billing@example.com
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
              setup_enterprise_billing_(sandbox):
                description: 'organizationId: "b0e12f6c-4c67-429d-a4a6-d9838b5da047"

                  sandbox: true

                  '
                value:
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
                  sandbox: true
            schema:
              $ref: '#/components/schemas/gitpod.v1.SetupEnterpriseBillingRequest'
