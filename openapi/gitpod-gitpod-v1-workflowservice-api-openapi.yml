                value:
                  filter:
                    workflowExecutionIds:
                    - d2c94c27-3b76-4a42-b88c-95a85e392c68
                  pagination:
                    pageSize: 50
            schema:
              $ref: '#/components/schemas/gitpod.v1.ListWorkflowExecutionOutputsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
