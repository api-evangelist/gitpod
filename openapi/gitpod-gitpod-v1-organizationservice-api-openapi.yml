                  tier: ORGANIZATION_TIER_ENTERPRISE
            schema:
              $ref: '#/components/schemas/gitpod.v1.SetTierRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.SetTierResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: SetTier
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateAnnouncementBanner:
    servers: []
    post:
      description: "Updates the announcement banner configuration for an organization.\n\n Use this method to configure the announcement banner displayed to all users.\n Only organization admins can update the banner. Requires Enterprise tier.\n\n ### Examples\n\n - Enable announcement banner:\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   message: \"Scheduled maintenance on Saturday 10pm-2am UTC\"\n   enabled: true\n   ```\n\n - Disable announcement banner:\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   enabled: false\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateAnnouncementBanner
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              disable_announcement_banner:
                description: 'organizationId: "b0e12f6c-4c67-429d-a4a6-d9838b5da047"

                  enabled: false

                  '
                value:
                  enabled: false
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
              enable_announcement_banner:
                description: 'organizationId: "b0e12f6c-4c67-429d-a4a6-d9838b5da047"

                  message: "Scheduled maintenance on Saturday 10pm-2am UTC"

                  enabled: true

                  '
                value:
                  enabled: true
                  message: Scheduled maintenance on Saturday 10pm-2am UTC
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateAnnouncementBannerRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateAnnouncementBannerResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateAnnouncementBanner
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateCustomDomain:
    servers: []
    post:
      description: "Updates custom domain configuration settings.\n\n Use this method to:\n - Update cloud provider settings\n - Change AWS account ID\n - Modify domain configuration\n\n ### Examples\n\n - Update AWS account ID:\n\n   Changes the AWS account ID for the custom domain.\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   domainName: \"workspaces.acme-corp.com\"\n   awsAccountId: \"987654321098\"\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateCustomDomain
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              update_aws_account_id:
                description: Changes the AWS account ID for the custom domain.
                value:
                  awsAccountId: '987654321098'
                  domainName: workspaces.acme-corp.com
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateCustomDomainRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateCustomDomainResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateCustomDomain
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateOIDCConfig:
    servers: []
    post:
      description: "Updates the OIDC token configuration for an organization.\n\n Use this method to:\n - Switch between OIDC token versions (V2 or V3)\n - Configure extra sub claim fields (V3 only)\n\n ### Examples\n\n - Enable V3 tokens with extra sub fields:\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   oidcConfig:\n     v3:\n       extraSubFields:\n         - \"environment_id\"\n         - \"creator_email\"\n   ```\n\n - Switch back to V2 tokens:\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   oidcConfig:\n     v2: {}\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateOIDCConfig
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              enable_v3_tokens_with_extra_sub_fields:
                description: "organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\noidcConfig:\n  v3:\n    extraSubFields:\n      - \"environment_id\"\n      - \"creator_email\"\n"
                value:
                  oidcConfig:
                    v3:
                      extraSubFields:
                      - environment_id
                      - creator_email
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
              switch_back_to_v2_tokens:
                description: "organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\noidcConfig:\n  v2: {}\n"
                value:
                  oidcConfig:
                    v2: {}
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateOIDCConfigRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateOIDCConfigResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateOIDCConfig
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateOrganization:
    servers: []
    post:
      description: "Updates an organization's settings including name, invite domains, and member policies.\n\n Use this method to:\n - Modify organization display name\n - Configure email domain restrictions\n - Update organization-wide settings\n - Manage member access policies\n\n ### Examples\n\n - Update basic settings:\n\n   Changes organization name and invite domains.\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   name: \"New Company Name\"\n   inviteDomains:\n     domains:\n       - \"company.com\"\n       - \"subsidiary.com\"\n   ```\n\n - Remove domain restrictions:\n\n   Clears all domain-based invite restrictions.\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   inviteDomains:\n     domains: []\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateOrganization
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              remove_domain_restrictions:
                description: Clears all domain-based invite restrictions.
                value:
                  inviteDomains:
                    domains: []
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
              update_basic_settings:
                description: Changes organization name and invite domains.
                value:
                  inviteDomains:
                    domains:
                    - company.com
                    - subsidiary.com
                  name: New Company Name
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateOrganizationResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateOrganization
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateOrganizationPolicies:
    servers: []
    post:
      description: "Updates organization policy settings.\n\n Use this method to:\n - Configure editor restrictions\n - Set environment resource limits\n - Define project creation permissions\n - Customize default configurations\n\n ### Examples\n\n - Update editor policies:\n\n   Restricts available editors and sets a default.\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   allowedEditorIds:\n     - \"vscode\"\n     - \"jetbrains\"\n   defaultEditorId: \"vscode\"\n   ```\n\n - Set environment limits:\n\n   Configures limits for environment usage.\n\n   ```yaml\n   organizationId: \"b0e12f6c-4c67-429d-a4a6-d9838b5da047\"\n   maximumEnvironmentTimeout: \"3600s\"\n   maximumRunningEnvironmentsPerUser: \"5\"\n   maximumEnvironmentsPerUser: \"20\"\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateOrganizationPolicies
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              set_environment_limits:
                description: Configures limits for environment usage.
                value:
                  maximumEnvironmentTimeout: 3600s
                  maximumEnvironmentsPerUser: '20'
                  maximumRunningEnvironmentsPerUser: '5'
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
              update_editor_policies:
                description: Restricts available editors and sets a default.
                value:
                  allowedEditorIds:
                  - vscode
                  - jetbrains
                  defaultEditorId: vscode
                  organizationId: b0e12f6c-4c67-429d-a4a6-d9838b5da047
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateOrganizationPoliciesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateOrganizationPoliciesResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateOrganizationPolicies
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateSCIMConfiguration:
    servers: []
    post:
      description: "Updates a SCIM configuration.\n\n Use this method to:\n - Enable or disable SCIM provisioning\n - Link or unlink SSO configuration\n - Update configuration name\n\n ### Examples\n\n - Disable SCIM:\n\n   Disables SCIM provisioning.\n\n   ```yaml\n   scimConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   enabled: false\n   ```\n\n - Link to SSO:\n\n   Links SCIM configuration to an SSO provider.\n\n   ```yaml\n   scimConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   ssoConfigurationId: \"f53d2330-3795-4c5d-a1f3-453121af9c60\"\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateSCIMConfiguration
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              disable_scim:
                description: Disables SCIM provisioning.
                value:
                  enabled: false
                  scimConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
              link_to_sso:
                description: Links SCIM configuration to an SSO provider.
                value:
                  scimConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
                  ssoConfigurationId: f53d2330-3795-4c5d-a1f3-453121af9c60
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateSCIMConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateSCIMConfigurationResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateSCIMConfiguration
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/UpdateSSOConfiguration:
    servers: []
    post:
      description: "Updates SSO provider settings and authentication rules.\n\n Use this method to:\n - Rotate client credentials\n - Update provider endpoints\n - Modify claim mappings\n - Change authentication policies\n - Toggle SSO enforcement\n\n ### Examples\n\n - Update credentials:\n\n   Rotates client ID and secret.\n\n   ```yaml\n   ssoConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   clientId: \"new-client-id\"\n   clientSecret: \"new-client-secret\"\n   ```\n\n - Update provider status:\n\n   Activates or deactivates SSO provider.\n\n   ```yaml\n   ssoConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   state: SSO_CONFIGURATION_STATE_ACTIVE\n   ```"
      operationId: gitpod.v1.OrganizationService.UpdateSSOConfiguration
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              update_credentials:
                description: Rotates client ID and secret.
                value:
                  clientId: new-client-id
                  clientSecret: new-client-secret
                  ssoConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
              update_provider_status:
                description: Activates or deactivates SSO provider.
                value:
                  ssoConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
                  state: SSO_CONFIGURATION_STATE_ACTIVE
            schema:
              $ref: '#/components/schemas/gitpod.v1.UpdateSSOConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.UpdateSSOConfigurationResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: UpdateSSOConfiguration
      tags:
      - gitpod.v1.OrganizationService
  /gitpod.v1.OrganizationService/VerifyDomain:
    servers: []
    post:
      description: "Verifies domain ownership for an organization.\n\n Use this method to:\n - Complete domain verification process\n - Enable domain-based features\n - Validate DNS configuration\n\n ### Examples\n\n - Verify domain ownership:\n\n   Verifies ownership after DNS records are configured.\n\n   ```yaml\n   domainVerificationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   ```"
      operationId: gitpod.v1.OrganizationService.VerifyDomain
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              verify_domain_ownership:
                description: Verifies ownership after DNS records are configured.
                value:
                  domainVerificationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
            schema:
              $ref: '#/components/schemas/gitpod.v1.VerifyDomainRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.VerifyDomainResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: VerifyDomain
      tags:
      - gitpod.v1.OrganizationService
components:
  schemas:
    gitpod.v1.CreateOrganizationInviteRequest:
      additionalProperties: false
      properties:
        organizationId:
          format: uuid
          title: organization_id
          type: string
      required:
      - organizationId
      title: CreateOrganizationInviteRequest
      type: object
    gitpod.v1.CustomDomainProvider:
      description: CustomDomainProvider represents the cloud provider for custom domain configuration
      enum:
      - CUSTOM_DOMAIN_PROVIDER_UNSPECIFIED
      - CUSTOM_DOMAIN_PROVIDER_AWS
      - CUSTOM_DOMAIN_PROVIDER_GCP
      title: CustomDomainProvider
      type: string
    gitpod.v1.SCIMConfiguration:
      additionalProperties: false
      description: SCIMConfiguration represents a SCIM 2.0 provisioning configuration
      properties:
        createdAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: created_at is when the SCIM configuration was created
          title: created_at
        enabled:
          description: enabled indicates if SCIM provisioning is active
          title: enabled
          type: boolean
        id:
          description: id is the unique identifier of the SCIM configuration
          format: uuid
          title: id
          type: string
        name:
          description: name is a human-readable name for the SCIM configuration
          maxLength: 128
          title: name
          type: string
        organizationId:
          description: organization_id is the ID of the organization this SCIM configuration belongs to
          format: uuid
          title: organization_id
          type: string
        ssoConfigurationId:
          description: sso_configuration_id is the linked SSO configuration (optional)
          format: uuid
          title: sso_configuration_id
          type: string
        tokenExpiresAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: token_expires_at is when the current SCIM token expires
          title: token_expires_at
        updatedAt:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
          description: updated_at is when the SCIM configuration was last updated
          title: updated_at
      required:
      - id
      - organizationId
      - createdAt
      - updatedAt
      - tokenExpiresAt
      title: SCIMConfiguration
      type: object
    gitpod.v1.SetTierRequest:
      additionalProperties: false
      properties:
        organizationId:
          description: organization_id is the ID of the organization to update
          format: uuid
          title: organization_id
          type: string
        tier:
          $ref: '#/components/schemas/gitpod.v1.OrganizationTier'
          description: tier is the new tier to set for the organization
          title: tier
      required:
      - organizationId
      - tier
      title: SetTierRequest
      type: object
    gitpod.v1.VerifyDomainResponse:
      additionalProperties: false
      properties:
        domainVerification:
          $ref: '#/components/schemas/gitpod.v1.DomainVerification'
          title: domain_verification
      required:
      - domainVerification
      title: VerifyDomainResponse
      type: object
    gitpod.v1.UpdateOrganizationPoliciesRequest.UpdateAgentPolicy:
      additionalProperties: false
      properties:
        commandDenyList:
          description: command_deny_list contains a list of commands that agents are not allowed to execute
          items:
            type: string
          title: command_deny_list
          type: array
        conversationSharingPolicy:
          $ref: '#/components/schemas/gitpod.v1.ConversationSharingPolicy'
          description: conversation_sharing_policy controls whether agent conversations can be shared
          nullable: true
          title: conversation_sharing_policy
        maxSubagentsPerEnvironment:
          description: "max_subagents_per_environment limits the number of non-terminal sub-agents\n a parent can have running simultaneously in the same environment.\n Valid range: 0-10. Zero means use the default (5)."
          format: int32
          maximum: 10
          nullable: true
          title: max_subagents_per_environment
          type: integer
        mcpDisabled:
          description: mcp_disabled controls whether MCP (Model Context Protocol) is disabled for agents
          nullable: true
          title: mcp_disabled
          type: boolean
        scmToolsAllowedGroupId:
          description: "scm_tools_allowed_group_id restricts SCM tools access to members of this group.\n Empty means no restriction (all users can use SCM tools if not disabled)."
          nullable: true
          title: scm_tools_allowed_group_id
          type: string
        scmToolsDisabled:
          description: scm_tools_disabled controls whether SCM (Source Control Management) tools are disabled for agents
          nullable: true
          title: scm_tools_disabled
          type: boolean
      title: UpdateAgentPolicy
      type: object
    gitpod.v1.DeleteSCIMConfigurationResponse:
      additionalProperties: false
      title: DeleteSCIMConfigurationResponse
      type: object
    gitpod.v1.GetCustomDomainResponse:
      additionalProperties: false
      properties:
        customDomain:
          $ref: '#/components/schemas/gitpod.v1.CustomDomain'
          title: custom_domain
      required:
      - customDomain
      title: GetCustomDomainResponse
      type: object
    gitpod.v1.ListDomainVerificationsResponse:
      additionalProperties: false
      properties:
        domainVerifications:
          items:
            $ref: '#/components/schemas/gitpod.v1.DomainVerification'
          title: domain_verifications
          type: array
        pagination:
          $ref: '#/components/schemas/gitpod.v1.PaginationResponse'
          title: pagination
      required:
      - pagination
      title: ListDomainVerificationsResponse
      type: object
    gitpod.v1.UserStatus:
      enum:
      - USER_STATUS_UNSPECIFIED
      - USER_STATUS_ACTIVE
      - USER_STATUS_SUSPENDED
      - USER_STATUS_LEFT
      title: UserStatus
      type: string
    gitpod.v1.OIDCConfigV3:
      additionalProperties: false
      description: OIDCConfigV3 configures V3 OIDC tokens with optional sub claim customization.
      properties:
        extraSubFields:
          description: "extra_sub_fields are additional property keys to include in the sub claim.\n Valid keys include: account_id, user_id, organization_id, project_id, runner_id,\n environment_id, creator_id, creator_principal, creator_email, creator_name,\n creator_idp, email, name, idp, runner_name, service_account_id, and\n dot-notation keys like creator_idp_claims.groups or idp_claims.department."
          items:
            maxItems: 50
            minLength: 1
            type: string
            uniqueItems: true
          maxItems: 50
          title: extra_sub_fields
          type: array
          uniqueItems: true
      title: OIDCConfigV3
      type: object
    gitpod.v1.CountResponseRelation:
      enum:
      - COUNT_RESPONSE_RELATION_UNSPECIFIED
      - COUNT_RESPONSE_RELATION_EQ
      - COUNT_RESPONSE_RELATION_GTE
      title: CountResponseRelation
      type: string
    gitpod.v1.JoinOrganizationResponse:
      additionalProperties: false
      properties:
        member:
          $ref: '#/components/schemas/gitpod.v1.OrganizationMember'
          description: member is the member that was created by joining the organization.
          title: member
      required:
      - member
      title: JoinOrganizationResponse
      type: object
    gitpod.v1.DeleteSSOConfigurationResponse:
      additionalProperties: false
      title: DeleteSSOConfigurationResponse
      type: object
    gitpod.v1.GetOIDCConfigResponse:
      additionalProperties: false
      description: GetOIDCConfigResponse is the response message for retrieving OIDC token configuration.
      properties:
        oidcConfig:
          $ref: '#/components/schemas/gitpod.v1.OIDCConfig'
          description: oidc_config is the current OIDC token configuration.
          title: oidc_config
      required:
      - oidcConfig
      title: GetOIDCConfigResponse
      type: object
    google.protobuf.Duration:
      description: "A Duration represents a signed, fixed-length span of time represented\n as a count of seconds and fractions of seconds at nanosecond\n resolution. It is independent of any calendar and concepts like \"day\"\n or \"month\". It is related to Timestamp in that the difference between\n two Timestamp values is a Duration and it can be added or subtracted\n from a Timestamp. Range is approximately +-10,000 years.\n\n # Examples\n\n Example 1: Compute Duration from two Timestamps in pseudo code.\n\n     Timestamp start = ...;\n     Timestamp end = ...;\n     Duration duration = ...;\n\n     duration.seconds = end.seconds - start.seconds;\n     duration.nanos = end.nanos - start.nanos;\n\n     if (duration.seconds < 0 && duration.nanos > 0) {\n       duration.seconds += 1;\n       duration.nanos -= 1000000000;\n     } else if (duration.seconds > 0 && duration.nanos < 0) {\n       duration.seconds -= 1;\n       duration.nanos += 1000000000;\n     }\n\n Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.\n\n     Timestamp start = ...;\n     Duration duration = ...;\n     Timestamp end = ...;\n\n     end.seconds = start.seconds + duration.seconds;\n     end.nanos = start.nanos + duration.nanos;\n\n     if (end.nanos < 0) {\n       end.seconds -= 1;\n       end.nanos += 1000000000;\n     } else if (end.nanos >= 1000000000) {\n       end.seconds += 1;\n       end.nanos -= 1000000000;\n     }\n\n Example 3: Compute Duration from datetime.timedelta in Python.\n\n     td = datetime.timedelta(days=3, minutes=10)\n     duration = Duration()\n     duration.FromTimedelta(td)\n\n # JSON Mapping\n\n In JSON format, the Duration type is encoded as a string rather than an\n object, where the string ends in the suffix \"s\" (indicating seconds) and\n is preceded by the number of seconds, with nanoseconds expressed as\n fractional seconds. For example, 3 seconds with 0 nanoseconds should be\n encoded in JSON format as \"3s\", while 3 seconds and 1 nanosecond should\n be expressed in JSON format as \"3.000000001s\", and 3 seconds and 1\n microsecond should be expressed in JSON format as \"3.000001s\"."
      format: regex
      pattern: ^[-\+]?([0-9]+\.?[0-9]*|\.[0-9]+)s$
      type: string
