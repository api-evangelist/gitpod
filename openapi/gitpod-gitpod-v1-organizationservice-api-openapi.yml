    post:
      description: "Regenerates the bearer token for a SCIM configuration.\n\n Use this method to:\n - Rotate SCIM credentials\n - Recover from token compromise\n - Update IdP configuration\n\n ### Examples\n\n - Regenerate token:\n\n   Creates a new bearer token with the same expiration duration as the previous token.\n\n   ```yaml\n   scimConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   ```\n\n - Regenerate token with new expiration:\n\n   Creates a new bearer token with a custom 180-day expiration.\n\n   ```yaml\n   scimConfigurationId: \"d2c94c27-3b76-4a42-b88c-95a85e392c68\"\n   tokenExpiresIn: \"15552000s\"\n   ```"
      operationId: gitpod.v1.OrganizationService.RegenerateSCIMToken
      parameters: []
      requestBody:
        content:
          application/json:
            examples:
              regenerate_token:
                description: Creates a new bearer token with the same expiration duration as the previous token.
                value:
                  scimConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
              regenerate_token_with_new_expiration:
                description: Creates a new bearer token with a custom 180-day expiration.
                value:
                  scimConfigurationId: d2c94c27-3b76-4a42-b88c-95a85e392c68
                  tokenExpiresIn: 15552000s
            schema:
              $ref: '#/components/schemas/gitpod.v1.RegenerateSCIMTokenRequest'
        required: true
      responses:
