      - gitpod.v1.SessionService
  /gitpod.v1.SessionService/ListSessionResources:
    servers: []
    post:
      operationId: gitpod.v1.SessionService.ListSessionResources
      parameters:
      - in: query
        name: pageSize
        schema:
          default: 25
          maximum: 100
          minimum: 0
          type: integer
      - in: query
        name: token
        schema:
          default: ''
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gitpod.v1.ListSessionResourcesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.ListSessionResourcesResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
