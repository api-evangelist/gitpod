          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.DeleteSessionResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: DeleteSession
      tags:
      - gitpod.v1.SessionService
  /gitpod.v1.SessionService/GetSession:
    servers: []
    post:
      operationId: gitpod.v1.SessionService.GetSession
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gitpod.v1.GetSessionRequest'
        required: true
      responses:
