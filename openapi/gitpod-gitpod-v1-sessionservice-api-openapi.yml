  x-displayName: gitpod.v1.SessionService
paths:
  /gitpod.v1.SessionService/AddSessionResource:
    servers: []
    post:
      operationId: gitpod.v1.SessionService.AddSessionResource
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gitpod.v1.AddSessionResourceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gitpod.v1.AddSessionResourceResponse'
          description: Success
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
          description: Error
      security:
      - bearerAuth: []
      summary: AddSessionResource
